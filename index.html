<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#111713" />
  <meta name="color-scheme" content="dark" />
  <title>AgentsRPG — Crônicas do Aquário</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <canvas id="world" aria-label="Mundo simulado"></canvas>

    <header class="topbar glass">
      <button id="menuBtn" class="iconBtn" aria-label="Abrir menu">☰</button>
      <div class="brand"><b>AgentsRPG</b><span id="worldMeta">dia 1 · manhã</span></div>
      <div class="spacer"></div>
      <button id="chronicleBtn" class="iconBtn" aria-label="Crônica">☷</button>
      <button id="statsBtn" class="iconBtn" aria-label="Mundo">◫</button>
    </header>

    <div class="timebar glass" role="group" aria-label="Velocidade da simulação">
      <button data-speed="0">Ⅱ</button><button data-speed="1" class="active">1×</button>
      <button data-speed="4">4×</button><button data-speed="16">16×</button>
      <button data-speed="64" title="Avanço rápido sem renderizar cada tick">≫</button>
    </div>

    <div id="criticalStrip" class="criticalStrip"></div>

    <aside id="sidePanel" class="panel hidden" aria-live="polite">
      <div class="panelHead"><div><b id="panelTitle">NPC</b><small id="panelSubtitle"></small></div><button id="panelClose">×</button></div>
      <div id="panelBody" class="panelBody"></div>
    </aside>

    <section id="drawer" class="drawer hidden glass">
      <div class="drawerHead"><b id="drawerTitle">Crônica</b><button id="drawerClose">×</button></div>
      <div id="drawerBody" class="drawerBody"></div>
    </section>

    <div id="toast" class="toast hidden"></div>

    <div id="boot" class="boot">
      <div class="bootCard">
        <div class="crest">◆</div>
        <h1>Crônicas do Aquário</h1>
        <p>Você não controla ninguém. Observe uma comunidade nascer, lembrar, amar, construir e decidir por conta própria se vale a pena descer.</p>
        <label>Seed do mundo<input id="seedInput" inputmode="numeric" autocomplete="off" /></label>
        <div class="bootActions"><button id="continueBtn" class="secondary hidden">Continuar</button><button id="newBtn">Novo mundo</button></div>
        <small>Simulação local · sem IA externa · salvamento no dispositivo</small>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
