name: Phase D Grid

on:
  pull_request:
    types: [synchronize]

concurrency:
  group: phase-d-grid-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  forage:
    if: github.head_ref == 'phase-d-work'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        forageYieldMult: ['0.80','0.65','0.50']
        seed: [42, 7919, 1337, 2026, 77, 909, 31415, 8888, 1201, 6543]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simulate forage-yield candidate
        run: node tools/calibrate.mjs --seed=${{ matrix.seed }} --days=30 --sample=5 --set=forageYieldMult:${{ matrix.forageYieldMult }} --out=grid-${{ matrix.forageYieldMult }}-${{ matrix.seed }}.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: grid-${{ matrix.forageYieldMult }}-${{ matrix.seed }}
          path: grid-${{ matrix.forageYieldMult }}-${{ matrix.seed }}.json

  aggregate:
    if: github.head_ref == 'phase-d-work'
    needs: forage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: grid-*
          path: grid-results
      - name: Aggregate forage-yield grid
        run: node tools/aggregate-grid-artifacts.mjs grid-results forageYieldMult phase-d-forage-grid.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase-d-forage-grid
          path: phase-d-forage-grid.json
