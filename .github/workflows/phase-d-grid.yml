name: Phase D Grid

on:
  pull_request:
    types: [synchronize]

jobs:
  hunger:
    if: github.head_ref == 'phase-d-work'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        hungerRate: ['0.00060','0.00072','0.00084']
        seed: [42, 7919, 1337, 2026, 77, 909, 31415, 8888, 1201, 6543]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simulate hunger-rate candidate
        run: node tools/calibrate.mjs --seed=${{ matrix.seed }} --days=30 --sample=5 --set=hungerRate:${{ matrix.hungerRate }} --out=grid-${{ matrix.hungerRate }}-${{ matrix.seed }}.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: grid-${{ matrix.hungerRate }}-${{ matrix.seed }}
          path: grid-${{ matrix.hungerRate }}-${{ matrix.seed }}.json

  aggregate:
    if: github.head_ref == 'phase-d-work'
    needs: hunger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: grid-*
          path: grid-results
      - name: Aggregate hunger-rate grid
        run: node tools/aggregate-grid-artifacts.mjs grid-results hungerRate phase-d-hunger-grid.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase-d-hunger-grid
          path: phase-d-hunger-grid.json
