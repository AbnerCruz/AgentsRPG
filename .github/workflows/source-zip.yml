name: Source ZIP

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=AgentsRPG-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: AgentsRPG-source
          path: AgentsRPG-source.zip
